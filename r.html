<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Raksha Bandhan</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            font-family: Georgia, serif;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 35px 20px;
            background: #fffaf0;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 4px solid #e91e63;
        }

        h1 {
            color: #c2185b;
            font-size: 38px;
            margin: 10px 0;
        }

        .heart {
            color: red;
            animation: beat 1s infinite;
        }

        .emoji {
            font-size: 70px;
            margin: 20px 0;
        }

        p {
            color: #333;
            font-size: 21px;
            line-height: 1.6;
        }

        .message {
            color: #7b1fa2;
            font-weight: bold;
            font-size: 24px;
        }

        button {
            margin-top: 20px;
            padding: 13px 25px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #ad1457;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="emoji">👫 🪢</div>

        <h1>
            Happy Raksha Bandhan
            <span class="heart">❤️</span>
        </h1>

        <p>
            A bond of love, laughter<br>
            & forever.
        </p>

        <hr>

        <p class="message">
            Always by your side, Sis! 💖
        </p>

        <p>
            No matter how far we are,<br>
            our bond will always remain strong. 🌸
        </p>

        <button onclick="showMessage()">
            Click for a Surprise ❤️
        </button>

    </div>

    <script>
        function showMessage() {
            alert("You are the best sister ever! ❤️ Happy Raksha Bandhan! 🎉");
        }
    </script>

</body>
</html>
